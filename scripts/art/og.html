<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>a11ymedic open graph image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Caveat:wght@700&family=Fredoka:wght@600;700&display=swap">
<style>
  /* Rendered to docs/og.png (1200 x 630, light) and assets/social-preview.png (1280 x 640,
     dark, with #dark) by scripts/art/render.sh. */
  :root { --paper: #fbf5ea; --card: #fffdf8; --ink: #1d3a40; --muted: #4f6266; --teal: #0a6b6d; --coral: #a63b28; --drop: #e3cfab; --teal-soft: #d3f0ea; --coral-soft: #ffe3dc; }
  .dark { --paper: #102a2f; --card: #15353b; --ink: #f3ead9; --muted: #b9cbc7; --teal: #5fd6cb; --coral: #ff9a87; --drop: #06171a; --teal-soft: #1b4a4f; --coral-soft: #4a2e2b; }
  html, body { margin: 0; padding: 0; }
  body { width: 100vw; height: 100vh; overflow: hidden; box-sizing: border-box; display: flex; align-items: center; gap: 40px; padding: 0 44px 0 60px; background: var(--paper); color: var(--ink); font-family: "Atkinson Hyperlegible Next", "Segoe UI", sans-serif;
    background-image: radial-gradient(700px 420px at 92% 0%, rgb(255 122 102 / 0.16), transparent 70%), radial-gradient(600px 400px at 0% 100%, rgb(15 139 141 / 0.13), transparent 70%); }
  .text { flex: 1; min-width: 0; }
  .kicker { display: inline-block; margin: 0; padding: 7px 16px; border: 3px solid var(--ink); border-radius: 14px 14px 14px 4px; background: var(--card); box-shadow: 4px 5px 0 var(--drop); font: 600 20px Fredoka, sans-serif; transform: rotate(-2deg); }
  h1 { margin: 22px 0 6px; font: 700 112px/0.95 Fredoka, sans-serif; letter-spacing: -2px; }
  h1 span { color: var(--teal); }
  .tag { margin: 0 0 24px; font-size: 26px; font-weight: 700; color: var(--muted); }
  .tag b { color: var(--coral); }
  .rx { border: 3px solid var(--ink); border-radius: 12px 12px 18px 18px; background: var(--card); box-shadow: 5px 6px 0 var(--drop); overflow: hidden; }
  .rx-head { display: flex; align-items: center; gap: 12px; padding: 6px 16px; background: var(--teal-soft); border-bottom: 3px dashed var(--ink); font: 600 21px Fredoka, sans-serif; }
  .rx-head i { font: 700 34px/1 Caveat, cursive; color: var(--coral); }
  .rx-head span { margin-left: auto; font: 600 15px "Atkinson Hyperlegible Mono", monospace; padding: 2px 10px; border: 2px solid currentColor; border-radius: 999px; color: var(--coral); background: var(--coral-soft); }
  .code { margin: 10px 14px; padding: 7px 12px; border-radius: 10px; font: 15px/1.3 "Atkinson Hyperlegible Mono", monospace; white-space: pre; overflow: hidden; border-left: 6px solid; background: var(--paper); }
  .del { border-color: #e5484d; }
  .add { border-color: #46b464; }
  .add em { font-style: normal; font-weight: 700; color: var(--teal); }
  .art { flex: none; width: 560px; }
  .art img { display: block; width: 100%; height: auto; border-radius: 30px; box-shadow: 8px 10px 0 var(--drop); }
</style>
</head>
<body>
  <div class="text">
    <p class="kicker">The accessibility clinic for websites</p>
    <h1>a11y<span>medic</span></h1>
    <p class="tag">Find accessibility problems. <b>Get the exact fix.</b></p>
    <div class="rx">
      <div class="rx-head"><i>Rx</i>Image without alt text<span>critical</span></div>
      <div class="code del">&lt;img src="team.jpg"&gt;</div>
      <div class="code add">&lt;img src="team.jpg" <em>alt="Our bakers at work"</em>&gt;</div>
    </div>
  </div>
  <div class="art"><img id="scene" src="../../docs/assets/art/clinic-light.svg" alt="Patch the otter paramedic treating a sick browser window in his clinic"></div>
  <script>
    if (location.hash === "#dark") {
      document.documentElement.classList.add("dark");
      document.getElementById("scene").src = "../../docs/assets/art/clinic-dark.svg";
    }
  </script>
</body>
</html>
