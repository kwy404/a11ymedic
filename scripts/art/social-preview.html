<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>a11ymedic social preview</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden; position: relative; box-sizing: border-box;
    background: #0B1F24; color: #E8F6F5;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; align-items: center; gap: 36px; padding: 0 56px 0 40px;
  }
  .blob { position: absolute; border-radius: 50%; background: #10323A; }
  .blob.a { width: 520px; height: 520px; left: 10px; top: 70px; }
  .blob.b { width: 300px; height: 300px; right: -90px; top: -120px; }
  .pulse { position: absolute; left: 0; bottom: 34px; }
  .plus { position: absolute; }
  .mascot { position: relative; flex: none; width: 490px; height: 490px; }
  .mascot img { display: block; width: 490px; height: 490px; }
  .text { position: relative; flex: 1; min-width: 0; }
  h1 { margin: 0; font-size: 104px; line-height: 1; font-weight: 700; letter-spacing: -2.5px; }
  h1 span { color: #2EC4B6; }
  .tag { margin: 14px 0 0; font-size: 31px; line-height: 1.25; font-weight: 600; color: #9FC9C6; }
  .tag b { color: #FF7A66; font-weight: 600; }
  .card {
    margin-top: 30px; background: #123840; border: 2px solid #1F5660; border-radius: 20px;
    padding: 20px 24px 22px; box-shadow: 0 18px 40px rgba(0, 0, 0, .28);
  }
  .head { display: flex; align-items: center; gap: 12px; }
  .head svg { flex: none; }
  .head strong { font-size: 25px; font-weight: 700; color: #FFFFFF; }
  .rule {
    margin-left: auto; font-family: Consolas, "Cascadia Mono", Menlo, monospace; font-size: 17px;
    color: #9FC9C6; border: 2px solid #1F5660; border-radius: 999px; padding: 3px 12px;
  }
  .why { margin: 8px 0 14px; font-size: 19px; color: #B9DAD7; }
  .code {
    font-family: Consolas, "Cascadia Mono", Menlo, monospace; font-size: 18px; line-height: 1.3;
    border-radius: 10px; padding: 7px 12px; white-space: pre; margin-top: 8px;
  }
  .del { background: #3D2A2C; color: #FFC2B8; }
  .add { background: rgba(46, 196, 182, .16); color: #C9F4EE; }
  .code i { font-style: normal; font-weight: 700; display: inline-block; width: 22px; }
  .del i { color: #FF7A66; }
  .add i { color: #2EC4B6; }
  .add em { font-style: normal; color: #FFFFFF; font-weight: 700; }
</style>
</head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>
  <svg class="pulse" width="1280" height="70" viewBox="0 0 1280 70" aria-hidden="true"><path d="M0 46H560L578 18L598 64L620 4L640 46H1280" fill="none" stroke="#2EC4B6" stroke-opacity=".22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="plus" style="right: 70px; top: 60px" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M10 0H20V10H30V20H20V30H10V20H0V10H10Z" fill="#FF7A66" fill-opacity=".9"/></svg>
  <svg class="plus" style="right: 150px; top: 36px" width="16" height="16" viewBox="0 0 30 30" aria-hidden="true"><path d="M10 0H20V10H30V20H20V30H10V20H0V10H10Z" fill="#2EC4B6" fill-opacity=".7"/></svg>
  <div class="mascot"><img src="../../assets/mascot-dark.svg" alt="Patch, the a11ymedic otter paramedic"></div>
  <div class="text">
    <h1>a11y<span>medic</span></h1>
    <p class="tag">Find accessibility problems. <b>Get the exact fix.</b></p>
    <div class="card">
      <div class="head">
        <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#E8F6F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5h-1v6a5 5 0 0 0 10 0v-6h-1"/><path d="M9 13.5v1.5a5.5 5.5 0 0 0 11 0v-3.5"/><circle cx="20" cy="9.5" r="2" fill="#FF7A66" fill-opacity=".25" stroke="#2EC4B6"/></g></svg>
        <strong>Image without alt text</strong>
        <span class="rule">image-alt</span>
      </div>
      <p class="why">Screen readers can only say "team.jpg". Describe what the image shows.</p>
      <div class="code del"><i>-</i>&lt;img src="team.jpg"&gt;</div>
      <div class="code add"><i>+</i>&lt;img src="team.jpg" <em>alt="Our team at the 2026 meetup"</em>&gt;</div>
    </div>
  </div>
</body>
</html>
